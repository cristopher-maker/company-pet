<main class="register w-full min-h-screen">
  <div class="topbar absolute top-4 left-4">
    <a routerLink="/login" aria-label="Volver al login" class="back inline-flex items-center justify-center w-10 h-10 rounded-full text-white hover:bg-white/10 transition-colors">
      <mat-icon>arrow_back</mat-icon>
    </a>
  </div>

  <div class="shell">
    <div class="auth-stage" aria-hidden="true">
      <div class="auth-shape auth-shape--leaf"></div>
      <div class="auth-shape auth-shape--paw"></div>
      <div class="auth-shape auth-shape--dot"></div>
      <div class="auth-shape auth-shape--dot auth-shape--dot2"></div>
      <div class="auth-floating auth-floating--paw1"><mat-icon>pets</mat-icon></div>
      <div class="auth-floating auth-floating--paw2"><mat-icon>pets</mat-icon></div>
      <div class="auth-floating auth-floating--bone1"><mat-icon>pets</mat-icon></div>
      <div class="auth-floating auth-floating--bone2"><mat-icon>pets</mat-icon></div>
      <div class="auth-floating auth-floating--paw3"><mat-icon>pets</mat-icon></div>
    </div>
    <div class="card" role="region" aria-label="Registro">
      <div class="brand">
        <div class="mark"><mat-icon>pets</mat-icon></div>
        <div class="brand-text">
          <div class="name">Company Pet</div>
          <div class="sub">cuidado pet para empresas</div>
        </div>
      </div>

      <h1 class="title">Crear cuenta</h1>
      <p class="hint">Selecciona tu perfil y completa tus datos.</p>

      <form class="form" (ngSubmit)="submit()">
        <div class="role-selector">
          <button
            type="button"
            class="role-option role-option--company"
            [class.active]="selectedRole === 'company_admin'"
            (click)="selectedRole = 'company_admin'"
          >
            <mat-icon class="role-icon">business</mat-icon>
            <span class="role-label">Empresa</span>
            <span class="role-desc">Beneficio para empleados</span>
          </button>
          <button
            type="button"
            class="role-option role-option--employee"
            [class.active]="selectedRole === 'employee'"
            (click)="selectedRole = 'employee'"
          >
            <mat-icon class="role-icon">badge</mat-icon>
            <span class="role-label">Empleado</span>
            <span class="role-desc">Con cupón de empresa</span>
          </button>
          <button
            type="button"
            class="role-option role-option--cuidador"
            [class.active]="selectedRole === 'cuidador'"
            (click)="selectedRole = 'cuidador'"
          >
            <mat-icon class="role-icon">favorite</mat-icon>
            <span class="role-label">Cuidador</span>
            <span class="role-desc">Servicios de cuidado pet</span>
          </button>
        </div>

        <div class="company-fields" *ngIf="selectedRole === 'company_admin'">
          <label class="pill" aria-label="Nombre de la empresa">
            <input
              [(ngModel)]="companyName"
              name="companyName"
              type="text"
              placeholder="Nombre de tu empresa"
              required
            />
            <mat-icon>business</mat-icon>
          </label>
          <label class="pill" aria-label="RUT de la empresa">
            <input
              [(ngModel)]="companyTaxId"
              name="companyTaxId"
              type="text"
              placeholder="RUT de la empresa (opcional)"
            />
            <mat-icon>badge</mat-icon>
          </label>
        </div>

        <div class="sub-role" *ngIf="selectedRole === 'cuidador'" role="radiogroup" aria-label="Tipo de cuidador">
          <button
            type="button"
            class="care-type"
            [class.active]="tipoCuidador === 'cuidador_domiciliario'"
            (click)="tipoCuidador = 'cuidador_domiciliario'"
            role="radio"
            [attr.aria-checked]="tipoCuidador === 'cuidador_domiciliario'"
          >
            <mat-icon>home</mat-icon>
            <span>Cuidador domiciliario</span>
          </button>
          <button
            type="button"
            class="care-type"
            [class.active]="tipoCuidador === 'paseador'"
            (click)="tipoCuidador = 'paseador'"
            role="radio"
            [attr.aria-checked]="tipoCuidador === 'paseador'"
          >
            <mat-icon>directions_walk</mat-icon>
            <span>Paseador</span>
          </button>
          <button
            type="button"
            class="care-type"
            [class.active]="tipoCuidador === 'residencia'"
            (click)="tipoCuidador = 'residencia'"
            role="radio"
            [attr.aria-checked]="tipoCuidador === 'residencia'"
          >
            <mat-icon>hotel</mat-icon>
            <span>Residencia</span>
          </button>
        </div>

        <label class="pill" aria-label="Nombre">
          <input
            [(ngModel)]="fullName"
            name="fullName"
            type="text"
            autocomplete="name"
            placeholder="Nombre y apellido"
            required
          />
          <mat-icon>person_outline</mat-icon>
        </label>

        <label class="pill" aria-label="Email">
          <input
            [(ngModel)]="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="Email"
            required
          />
          <mat-icon>mail_outline</mat-icon>
        </label>

        <label class="pill" aria-label="Contraseña">
          <input
            [(ngModel)]="password"
            name="password"
            [type]="showPassword ? 'text' : 'password'"
            autocomplete="new-password"
            placeholder="Contraseña"
            required
          />
          <button
            type="button"
            class="icon-btn"
            (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </label>

        <div class="msg error" *ngIf="error">{{ error }}</div>
        <div class="msg success" *ngIf="success">{{ success }}</div>

        <button class="primary" type="submit" [disabled]="loading">
          <svg *ngIf="loading" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span *ngIf="!loading">Crear cuenta</span>
        </button>

        <div class="bottom">
          <span class="muted">¿Ya tienes cuenta?</span>
          <a class="link" routerLink="/login">Ingresar</a>
        </div>
      </form>
    </div>
  </div>
</main>
